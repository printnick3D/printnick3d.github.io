<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Калькулятор стоимости 3D‑печати</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-zinc-900 text-zinc-100 min-h-screen flex items-center justify-center p-4">
<div class="bg-zinc-800 shadow-2xl rounded-xl p-6 w-full max-w-4xl">
  <h1 class="text-2xl font-semibold mb-6 text-center">
    <i class="fas fa-cube mr-2"></i>Калькулятор стоимости 3D‑печати
  </h1>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
    <!-- Левая панель -->
    <div class="space-y-4">

      <div>
        <label class="text-sm text-zinc-400 flex items-center">
          <i class="fas fa-box-open mr-2"></i>Материал
        </label>
        <select id="material" class="w-full bg-zinc-900 border border-zinc-700 rounded-lg p-2 mt-1"></select>
      </div>

      <div>
        <label class="text-sm text-zinc-400 flex items-center">
          <i class="fas fa-palette mr-2"></i>Цвет
        </label>
        <input id="color" type="text" class="w-full bg-zinc-900 border border-zinc-700 rounded-lg p-2 mt-1" disabled>
      </div>

      <div>
        <label class="text-sm text-zinc-400 flex items-center">
          <i class="fas fa-weight-hanging mr-2"></i>Вес детали (г)
        </label>
        <input id="weight" type="number" min="0" step="0.1" class="w-full bg-zinc-900 border border-zinc-700 rounded-lg p-2 mt-1">
      </div>

      <div>
        <label class="text-sm text-zinc-400 flex items-center">
          <i class="fas fa-clock mr-2"></i>Время печати (ч)
        </label>
        <input id="time" type="number" min="0" step="0.1" class="w-full bg-zinc-900 border border-zinc-700 rounded-lg p-2 mt-1">
      </div>

      <div>
        <label class="text-sm text-zinc-400 flex items-center">
          <i class="fas fa-star mr-2"></i>Коэффициент сложности
        </label>
        <select id="complexity" class="w-full bg-zinc-900 border border-zinc-700 rounded-lg p-2 mt-1">
          <option value="1">Обычная (1.0)</option>
          <option value="1.2">Средняя (1.2)</option>
          <option value="1.5">Сложная (1.5)</option>
        </select>
      </div>

      <div>
        <label class="text-sm text-zinc-400 flex items-center">
          <i class="fas fa-print mr-2"></i>Принтер
        </label>
        <select id="printer" class="w-full bg-zinc-900 border border-zinc-700 rounded-lg p-2 mt-1">
          <option value="a1">BambuLab A1 (0.3 кВт)</option>
          <option value="h2s">BambuLab H2S (0.5 кВт)</option>
          <option value="custom">Другой</option>
        </select>
      </div>

      <!-- Мощность принтера для кастомного варианта -->
      <div id="customPowerContainer" class="hidden">
        <label class="text-sm text-zinc-400 flex items-center">
          <i class="fas fa-bolt mr-2"></i>Мощность принтера (кВт)
        </label>
        <input id="customPower" type="number" min="0.1" step="0.1" value="0.3" class="w-full bg-zinc-900 border border-zinc-700 rounded-lg p-2 mt-1">
      </div>

      <div>
        <label class="text-sm text-zinc-400 flex items-center">
          <i class="fas fa-ruble-sign mr-2"></i>Себестоимость пластика (руб/кг)
        </label>
        <input id="materialCostField" type="number" min="0" step="1" class="w-full bg-zinc-900 border border-zinc-700 rounded-lg p-2 mt-1" placeholder="600">
      </div>

      <div>
        <label class="text-sm text-zinc-400 flex items-center">
          <i class="fas fa-tools mr-2"></i>Стоимость печати (руб/ч)
        </label>
        <input id="printCost" type="number" min="0" step="1" class="w-full bg-zinc-900 border border-zinc-700 rounded-lg p-2 mt-1" value="50">
      </div>

      <!-- Дополнительные услуги -->
      <div class="border-t border-zinc-700 pt-4">
        <h3 class="text-sm font-medium text-zinc-300 mb-3 flex items-center">
          <i class="fas fa-plus-circle mr-2"></i>Дополнительные услуги
        </h3>
        
        <!-- Моделирование -->
        <div class="mb-3">
          <div class="flex items-center space-x-2 mb-2">
            <input type="checkbox" id="useModeling" checked>
            <label for="useModeling" class="text-sm text-zinc-400 flex items-center">
              <i class="fas fa-cube mr-2"></i>Моделирование
            </label>
          </div>
          <div class="grid grid-cols-2 gap-2">
            <input id="modelingCost" type="number" min="0" step="50" class="w-full bg-zinc-900 border border-zinc-700 rounded-lg p-2" value="300" placeholder="руб/ч">
            <input id="modelingTime" type="number" min="0" step="0.5" class="w-full bg-zinc-900 border border-zinc-700 rounded-lg p-2" value="1" placeholder="ч">
          </div>
        </div>

        <!-- Постобработка -->
        <div class="mb-3">
          <div class="flex items-center space-x-2 mb-2">
            <input type="checkbox" id="usePostprocess" checked>
            <label for="usePostprocess" class="text-sm text-zinc-400 flex items-center">
              <i class="fas fa-paint-roller mr-2"></i>Постобработка
            </label>
          </div>
          <div class="grid grid-cols-2 gap-2">
            <input id="postprocessCost" type="number" min="0" step="50" class="w-full bg-zinc-900 border border-zinc-700 rounded-lg p-2" value="100" placeholder="руб/ч">
            <input id="postprocessTime" type="number" min="0" step="0.5" class="w-full bg-zinc-900 border border-zinc-700 rounded-lg p-2" value="1" placeholder="ч">
          </div>
        </div>

        <!-- Упаковка -->
        <div class="mb-3">
          <div class="flex items-center space-x-2 mb-2">
            <input type="checkbox" id="usePackaging" checked>
            <label for="usePackaging" class="text-sm text-zinc-400 flex items-center">
              <i class="fas fa-box mr-2"></i>Упаковка
            </label>
          </div>
          <input id="packagingCost" type="number" min="0" step="10" class="w-full bg-zinc-900 border border-zinc-700 rounded-lg p-2" value="20" placeholder="руб">
        </div>
      </div>

      <button onclick="calculate()" class="w-full bg-emerald-600 hover:bg-emerald-500 transition py-3 rounded-lg font-medium mt-4 flex items-center justify-center">
        <i class="fas fa-calculator mr-2"></i>Рассчитать стоимость
      </button>
      
      <button onclick="saveCalculation()" class="w-full bg-blue-600 hover:bg-blue-500 transition py-3 rounded-lg font-medium mt-2 flex items-center justify-center">
        <i class="fas fa-save mr-2"></i>Сохранить расчет
      </button>
      
      <button onclick="resetCalculator()" class="w-full bg-red-600 hover:bg-red-500 transition py-3 rounded-lg font-medium mt-2 flex items-center justify-center">
        <i class="fas fa-redo mr-2"></i>Сбросить
      </button>
    </div>

    <!-- Правая панель -->
    <div class="bg-zinc-900 rounded-lg p-4">
      <h2 class="text-lg font-medium mb-3 flex items-center">
        <i class="fas fa-receipt mr-2"></i>Расшифровка стоимости
      </h2>
      <div class="max-h-96 overflow-y-auto pr-2">
        <table class="w-full text-sm">
          <tbody id="breakdown" class="divide-y divide-zinc-700"></tbody>
        </table>
      </div>
      <div class="mt-4 text-xl font-semibold text-right" id="total">Итого: 0.00 ₽</div>
      <div class="mt-2 text-sm text-zinc-400">Себестоимость пластика: <span id="materialCostDisplay">0 ₽</span></div>
      
      <!-- Сохраненные расчеты -->
      <div class="mt-6 border-t border-zinc-700 pt-4">
        <h3 class="text-sm font-medium text-zinc-300 mb-3 flex items-center">
          <i class="fas fa-history mr-2"></i>История расчетов
        </h3>
        <div class="max-h-40 overflow-y-auto" id="savedCalculations">
          <div class="text-center text-zinc-500 text-sm py-4">Нет сохраненных расчетов</div>
        </div>
        <button onclick="clearHistory()" class="w-full mt-2 bg-zinc-700 hover:bg-zinc-600 transition py-2 rounded-lg text-sm">
          Очистить историю
        </button>
      </div>
    </div>
  </div>
  
  <!-- Футер -->
  <div class="mt-6 pt-4 border-t border-zinc-700 text-center text-xs text-zinc-500">
    <p>Калькулятор 3D-печати v1.0 | Адаптировано для GitHub Pages</p>
    <p class="mt-1">Все расчеты производятся локально в вашем браузере</p>
  </div>
</div>

<!-- Модальное окно для сохранения расчета -->
<div id="saveModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-50">
  <div class="bg-zinc-800 rounded-lg p-6 w-full max-w-md mx-4">
    <h3 class="text-lg font-medium mb-4">Сохранить расчет</h3>
    <input type="text" id="calculationName" placeholder="Название расчета" class="w-full bg-zinc-900 border border-zinc-700 rounded-lg p-3 mb-4">
    <div class="flex justify-end space-x-2">
      <button onclick="closeSaveModal()" class="px-4 py-2 bg-zinc-700 hover:bg-zinc-600 rounded-lg">Отмена</button>
      <button onclick="confirmSave()" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 rounded-lg">Сохранить</button>
    </div>
  </div>
</div>

<script src="calculator.js"></script>
</body>
</html>
